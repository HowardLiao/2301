<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>光寶科技 (2301) · 企業主權 AI 路由器架構圖 Draw.io 官方動態預覽</title>
  <style>
    :root {
      --bg-base: #0B1120;
      --bg-card: #1E293B;
      --border-card: #334155;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --cyan: #38BDF8;
      --emerald: #34D399;
      --amber: #FBBF24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-base);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }
    .top-bar {
      height: 64px;
      background: #0F172A;
      border-bottom: 1px solid var(--border-card);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      flex-shrink: 0;
      gap: 16px;
    }
    .title-group {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .logo-icon {
      font-size: 22px;
    }
    .title-text h1 {
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #F8FAFC;
    }
    .title-text p {
      font-size: 11px;
      color: var(--text-muted);
    }
    .tab-group {
      display: flex;
      gap: 6px;
      background: #1E293B;
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--border-card);
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tab-btn:hover {
      color: #FFF;
      background: rgba(255, 255, 255, 0.05);
    }
    .tab-btn.active {
      background: #0284C7;
      color: #FFF;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.4);
    }
    .action-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .btn-action {
      background: #334155;
      color: #F8FAFC;
      border: 1px solid #475569;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-action:hover {
      background: #475569;
      border-color: #64748B;
    }
    .btn-primary {
      background: #0284C7;
      border-color: #0284C7;
    }
    .btn-primary:hover {
      background: #0369A1;
    }
    .viewer-container {
      flex: 1;
      width: 100%;
      height: calc(100% - 64px);
      position: relative;
      background: #111827;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #111827;
    }
    .loading-overlay {
      position: absolute;
      inset: 0;
      background: #0B1120;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 10;
      transition: opacity 0.3s;
    }
    .loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #334155;
      border-top-color: #38BDF8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- 頂部切換與工具列 -->
  <div class="top-bar">
    <div class="title-group">
      <div class="logo-icon">⚡</div>
      <div class="title-text">
        <h1>光寶科技 (2301) · 企業主權 AI 路由器 (Howard Route) 架構視圖</h1>
        <p>Draw.io 官方高解析動態燈箱預覽 · 向量節點縮放 / 拖曳 / 圖層檢索</p>
      </div>
    </div>

    <!-- 頁籤切換器 -->
    <div class="tab-group">
      <button class="tab-btn active" onclick="switchDiagram(0)">
        <span>👤</span> 1. 使用者用例架構圖 (Use Case)
      </button>
      <button class="tab-btn" onclick="switchDiagram(1)">
        <span>⚙️</span> 2. 系統部署架構圖 (Deployment)
      </button>
      <button class="tab-btn" onclick="switchDiagram(2)">
        <span>🌐</span> 3. 端到端全景五層架構 (End-to-End)
      </button>
    </div>

    <!-- 外部跳轉與下載 -->
    <div class="action-group">
      <a id="btn-open-edit" href="#" target="_blank" class="btn-action btn-primary" title="在 Draw.io 官方編輯器中直接開啟">
        <span>🚀</span> 在 diagrams.net 編輯
      </a>
      <a id="btn-download" href="#" class="btn-action" download title="下載原始 .drawio 檔案">
        <span>📥</span> 下載 .drawio
      </a>
    </div>
  </div>

  <!-- 燈箱展示容器 -->
  <div class="viewer-container">
    <div id="loader" class="loading-overlay">
      <div class="spinner"></div>
      <div style="font-size:13px; color:var(--text-muted);">正在載入 Draw.io 官方向量渲染引擎...</div>
    </div>
    <iframe id="diagram-frame" src="about:blank"></iframe>
  </div>

  <script>
    // 預載的三大架構圖資訊
    const DIAGRAMS = [
      {
        id: "use_case",
        title: "使用者情境與調用架構 (Use Case Diagram)",
        file: "model_route_use_case.drawio",
        rawUrl: "https://raw.githubusercontent.com/HowardLiao/2301/main/assets/drawio/model_route_use_case.drawio"
      },
      {
        id: "deployment",
        title: "雲地混合部署拓撲架構 (Deployment Diagram)",
        file: "model_route_deployment.drawio",
        rawUrl: "https://raw.githubusercontent.com/HowardLiao/2301/main/assets/drawio/model_route_deployment.drawio"
      },
      {
        id: "e2e",
        title: "端到端生命週期與五層架構全景拓撲 (End-to-End Architecture)",
        file: "enterprise_ai_end_to_end_architecture.drawio",
        rawUrl: "https://raw.githubusercontent.com/HowardLiao/2301/main/assets/drawio/enterprise_ai_end_to_end_architecture.drawio"
      }
    ];

    let currentIndex = 0;
    const diagramCache = {};

    async function loadDiagramData(index) {
      const diag = DIAGRAMS[index];
      if (diagramCache[index]) {
        return diagramCache[index];
      }
      try {
        const response = await fetch(diag.file);
        if (!response.ok) throw new Error("Local fetch failed: " + response.statusText);
        const xml = await response.text();
        diagramCache[index] = xml;
        return xml;
      } catch (err) {
        console.warn("Falling back to raw URL:", err);
        return null;
      }
    }

    async function switchDiagram(index) {
      currentIndex = index;
      const loader = document.getElementById("loader");
      const frame = document.getElementById("diagram-frame");
      const btnEdit = document.getElementById("btn-open-edit");
      const btnDownload = document.getElementById("btn-download");
      const tabs = document.querySelectorAll(".tab-btn");

      tabs.forEach((tab, i) => {
        tab.classList.toggle("active", i === index);
      });

      loader.classList.remove("hidden");

      const diag = DIAGRAMS[index];
      btnDownload.href = diag.file;
      btnDownload.setAttribute("download", diag.file);

      // 設定 diagrams.net 官方編輯連結
      btnEdit.href = `https://app.diagrams.net/#U${encodeURIComponent(diag.rawUrl)}`;

      // 取得 XML 並組裝 viewer 參數
      const xml = await loadDiagramData(index);
      let viewerUrl = "";
      if (xml) {
        const encodedXml = encodeURIComponent(xml);
        // 使用 viewer.diagrams.net Lightbox 參數：自動深色模式、可放大縮小、支援多圖層導航
        viewerUrl = `https://viewer.diagrams.net/?tags=%7B%7D&lightbox=1&highlight=0000ff&edit=_blank&layers=1&nav=1&dark=auto#R${encodedXml}`;
      } else {
        // Fallback 直連 GitHub raw 檔
        viewerUrl = `https://viewer.diagrams.net/?tags=%7B%7D&lightbox=1&highlight=0000ff&edit=_blank&layers=1&nav=1&dark=auto#U${encodeURIComponent(diag.rawUrl)}`;
      }

      frame.onload = () => {
        loader.classList.add("hidden");
      };

      frame.src = viewerUrl;
    }

    // 初始化載入第一張
    window.addEventListener("DOMContentLoaded", () => {
      switchDiagram(0);
    });
  </script>
</body>
</html>
